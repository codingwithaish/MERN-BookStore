services:
  - type: web
    name: mern-bookstore-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 8080
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: static
          name: mern-bookstore-web
          property: url

  - type: static
    name: mern-bookstore-web
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mern-bookstore-api
          property: url
